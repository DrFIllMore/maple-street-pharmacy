<title>Maple Street Lot</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one screen. Status bar on top, the lot fills the middle, tool dock at the bottom; Career slides over from the right. Tokens match the game. */
:root{
  --bg:#cfdad0; --panel:#fffdf7; --ink:#243028; --ink-2:#66736b; --line:#c9d3ca;
  --accent:#1d9e75; --accent-ink:#085041; --accent-soft:#e1f5ee; --owed:#ba7517; --bad:#a32d2d; --bad-soft:#fcebeb; --good:#3b6d11; --gold:#c98a12;
  --sans:"Nunito",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a16; --panel:#1e2521; --ink:#eef1ec; --ink-2:#a2aca5; --line:#36403a;
  --accent:#5dcaa5; --accent-ink:#e1f5ee; --accent-soft:#0f3a2e; --owed:#fac775; --bad:#f09595; --bad-soft:#3f1a1a; --good:#c0dd97; --gold:#f2c35b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a16; --panel:#1e2521; --ink:#eef1ec; --ink-2:#a2aca5; --line:#36403a;
  --accent:#5dcaa5; --accent-ink:#e1f5ee; --accent-soft:#0f3a2e; --owed:#fac775; --bad:#f09595; --bad-soft:#3f1a1a; --good:#c0dd97; --gold:#f2c35b; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:6px 10px;font-weight:800}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.chip{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px 10px;font-weight:800;min-width:0}
.chip small{color:var(--ink-2);font-weight:700;font-size:.72em;letter-spacing:.05em;text-transform:uppercase}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.lvl{cursor:pointer}
.lvl .badge{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:900;font-size:14px;flex:none}
.lvl .xp{display:grid;gap:3px;min-width:0}
.lvl .xp b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.92em}
.trk{height:6px;border-radius:3px;background:var(--line);overflow:hidden;width:120px;max-width:30vw}
.trk i{display:block;height:100%;background:var(--accent);transition:width .4s}
.lane.ok{color:var(--accent-ink);background:var(--accent-soft)}
.lane.bad{color:var(--bad);background:var(--bad-soft)}
.sp{margin-left:auto;display:flex;gap:4px}
.sp button{padding:5px 9px}
.sp button.on,.seg button.on,.tool.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.stage{position:relative;min-height:0;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--bg)}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hint{position:absolute;left:10px;bottom:10px;right:10px;pointer-events:none;display:flex}
.hint span{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-weight:700;font-size:.9em;max-width:100%}
.hint span.err{color:var(--bad);border-color:var(--bad)}
.dock{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0}
.tool{display:flex;align-items:center;gap:6px}
.tool .lk{font-size:.75em;color:var(--ink-2);font-weight:800}
.tool .pr{font-family:var(--mono);font-size:.8em;color:var(--ink-2)}
.tool.on .pr,.tool.on .lk{color:#fff}
.zoom{margin-left:auto;display:flex;gap:4px}
/* career panel */
.panel{position:absolute;top:0;right:0;bottom:0;width:min(360px,92%);background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;transform:translateX(102%);transition:transform .25s;z-index:5}
.panel.open{transform:none}
.panel header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.panel header h2{margin:0;font-size:1.05em;flex:1}
.tabs{display:flex;gap:4px;padding:8px 12px 0}
.tabs button{padding:4px 10px;font-size:.88em}
.tabs button.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.pbody{overflow:auto;padding:10px 12px 14px;display:grid;gap:8px;align-content:start;min-height:0;flex:1}
.lvcard{display:grid;gap:6px;padding:10px;border-radius:12px;background:var(--accent-soft)}
.lvcard .t{display:flex;align-items:baseline;gap:8px}
.lvcard .t b{font-size:1.25em}
.lvcard .trk{width:100%;max-width:none;height:8px}
.small{font-size:.86em;color:var(--ink-2);font-weight:700}
.row{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.row .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:900;background:var(--line);color:var(--ink-2);font-size:.85em}
.row.done .ic{background:var(--accent);color:#fff}
.row.now .ic{background:var(--gold);color:#fff}
.row b{display:block;font-size:.95em}
.row small{color:var(--ink-2);font-weight:600;display:block;line-height:1.3}
.row .r{font-family:var(--mono);font-size:.82em;color:var(--ink-2);text-align:right;white-space:nowrap}
.row .trk{width:100%;max-width:none;height:5px;margin-top:4px}
.plan h3{margin:6px 0 2px;font-size:.95em}
.plan p{margin:0;line-height:1.45;font-size:.9em}
.plan ul{margin:2px 0 0;padding-left:18px;line-height:1.45;font-size:.9em}
/* sheet */
.sheet{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:min(380px,calc(100% - 24px));background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px;z-index:4;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.sheet h3{margin:0;font-size:1.05em;display:flex;justify-content:space-between;gap:8px}
.sheet p{margin:0;line-height:1.4;font-size:.92em}
.sheet .acts{display:flex;gap:6px;flex-wrap:wrap}
.sheet .acts .pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.toasts{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:grid;gap:6px;z-index:6;pointer-events:none;width:min(360px,calc(100% - 24px))}
.toast{background:var(--ink);color:var(--panel);border-radius:12px;padding:8px 12px;font-weight:800;display:flex;gap:10px;align-items:center;animation:pop .3s ease-out}
.toast i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--gold);color:#fff;display:grid;place-items:center;flex:none}
.toast small{display:block;font-weight:600;opacity:.8}
@keyframes pop{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}.panel{transition:none}}
@media (max-width:560px){.tool .pr{display:none}.lvl .xp b{max-width:34vw}}
@media (max-height:460px){.tool .pr{display:none}.dock button,.bar .chip,.sp button{padding:4px 8px;font-size:.88em}.lvl .badge{width:24px;height:24px}.dock{flex-wrap:nowrap;overflow:hidden}.zoom #zOut,.zoom #zIn{display:none}}
</style>

<div class="app">
  <div class="bar">
    <div class="chip lvl" id="lvlChip" role="button" tabindex="0" aria-label="Open career"><span class="badge" id="lvN">3</span><span class="xp"><b id="lvT">Trusted Name</b><span class="trk"><i id="lvBar"></i></span></span></div>
    <div class="chip"><small>Cash</small><b class="num" id="cash">$0</b></div>
    <div class="chip lane" id="lane"><small>Drive-thru</small><b id="laneT">—</b></div>
    <div class="chip"><small>Served</small><b class="num" id="served">0</b></div>
    <div class="sp" role="group" aria-label="Speed"><button id="sp0">❚❚</button><button id="sp1" class="on">▶</button><button id="sp3">▶▶</button></div>
  </div>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="toasts" id="toasts"></div>
    <div class="hint"><span id="hint">Outside view: the lot, the street and the land next door.</span></div>
    <div class="sheet" id="sheet" hidden></div>
    <aside class="panel" id="panel" aria-label="Career">
      <header><h2>Career</h2><button id="pClose" aria-label="Close">✕</button></header>
      <div class="tabs"><button data-tab="level" class="on">Level</button><button data-tab="ach">Achievements</button><button data-tab="plan">How it fits</button></div>
      <div class="pbody" id="pbody"></div>
    </aside>
  </div>
  <div class="dock">
    <div class="seg" role="group" aria-label="View"><button id="vIn">Inside</button><button id="vOut" class="on">Outside</button></div>
    <button class="tool" data-tool="drive">Driveway <span class="pr">$40</span></button>
    <button class="tool" data-tool="window">Window <span class="pr">$3.5k</span></button>
    <button class="tool" data-tool="erase">Remove</button>
    <button class="tool" data-tool="land">Land</button>
    <button id="clerk2">+ Window clerk</button>
    <div class="zoom"><button id="zOut" aria-label="Zoom out">−</button><button id="zIn" aria-label="Zoom in">+</button><button id="career">Career</button></div>
  </div>
</div>

<script>
(()=>{
/* ---------- world ---------- */
const GW=22,GD=18,STREET=[19,20],SIDEWALK=18;
const LEVELS=[{t:'New Owner',xp:0},{t:'Neighborhood Pharmacist',xp:150},{t:'Trusted Name',xp:400},{t:'Community Anchor',xp:800},{t:'Maple Street Institution',xp:1400},{t:'Regional Name',xp:2200}];
const UNLOCK={drive:2,window:3,land:4,expand:5,store2:6};
const UNLOCK_TXT={1:'Run the store',2:'Pave a driveway',3:'Drive-thru window',4:'Buy the land next door',5:'Expand the floor onto your land',6:'Open a second store'};
const COST={drive:40,window:3500,clerk2:140};
const ACH=[
 {id:'firstcar',t:'First drive-thru customer',d:'Serve one car at the window.',goal:1,stat:'cars',xp:50},
 {id:'pave10',t:'Paved the way',d:'Lay 10 driveway tiles.',goal:10,stat:'paved',xp:40},
 {id:'rush',t:'Rush hour',d:'Have 5 cars lined up at once.',goal:5,stat:'maxLine',xp:80},
 {id:'streak',t:'Nobody drove off',d:'Serve 25 cars in a row without one driving past.',goal:25,stat:'streak',xp:100},
 {id:'cars50',t:'Drive-thru regulars',d:'Serve 50 cars.',goal:50,stat:'cars',xp:120},
 {id:'walk100',t:'Steady counter',d:'Serve 100 walk-in customers.',goal:100,stat:'walk',xp:80},
 {id:'land',t:'Land owner',d:'Buy a lot next to the store.',goal:1,stat:'parcels',xp:100},
 {id:'grow',t:'Room to grow',d:'Expand the floor onto your land.',goal:1,stat:'expanded',xp:150},
 {id:'lv5',t:'Maple Street Institution',d:'Reach level 5.',goal:5,stat:'level',xp:0}];

const G={
  b:{x0:2,y0:4,x1:13,y1:12},
  door:{x:13,y:10},
  win:{x:13,y:6},
  drive:new Set(),
  parcels:{
    N:{name:'North lot',x0:2,y0:0,x1:17,y1:3,price:18000,expand:9000,state:'sale'},
    S:{name:'South lot',x0:2,y0:13,x1:17,y1:17,price:15000,expand:9000,state:'sale'}},
  cash:24000,xp:720,level:3,clerks:1,
  st:{cars:0,walk:0,paved:0,maxLine:0,streak:0,parcels:0,expanded:0,level:3,drovePast:0,walkLost:0},
  ach:new Set(),
  cars:[],peds:[],staff:[],speed:1,view:'out',tool:null,
  t:0,nextCar:1.5,nextPed:1};
const K=(x,y)=>x+','+y;
/* example start: a drive-thru already built (level 3) */
for(const [x,y] of [[18,9],[17,9],[16,9],[15,9],[14,9],[14,8],[14,7],[14,6],[14,5],[14,4],[15,4],[16,4],[17,4],[18,4]])G.drive.add(K(x,y));
G.st.paved=G.drive.size;G.ach.add('pave10');

const inB=(x,y)=>x>=G.b.x0&&x<=G.b.x1&&y>=G.b.y0&&y<=G.b.y1;
const walkway=(x,y)=>y===G.door.y&&x>G.b.x1&&x<SIDEWALK;
function parcelAt(x,y){for(const k in G.parcels){const p=G.parcels[k];if(x>=p.x0&&x<=p.x1&&y>=p.y0&&y<=p.y1)return k;}return null;}
function owned(x,y){if(inB(x,y))return false;if(x>G.b.x1&&x<SIDEWALK&&y>=4&&y<=12)return true;const k=parcelAt(x,y);return !!(k&&G.parcels[k].state!=='sale');}
function canPave(x,y){if(walkway(x,y)||inB(x,y))return false;if(x===SIDEWALK)return owned(x-1,y)&&y!==G.door.y;return owned(x,y);}
function tileType(x,y){if(STREET.includes(x))return 'street';if(x===SIDEWALK)return G.drive.has(K(x,y))?'curb':'sidewalk';if(inB(x,y))return 'floor';if(walkway(x,y))return 'walk';if(G.drive.has(K(x,y)))return 'drive';if(owned(x,y))return 'lot';const k=parcelAt(x,y);if(k)return 'sale';return 'grass';}

/* ---------- drive-thru lane ---------- */
let LANE={ok:false,msg:'No window yet'};
function winFront(){return G.win?[G.win.x+1,G.win.y]:null;}
function bfs(from,to,block){const q=[from],prev=new Map([[K(...from),null]]);while(q.length){const c=q.shift();if(c[0]===to[0]&&c[1]===to[1])break;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const n=[c[0]+dx,c[1]+dy],k=K(...n);if(prev.has(k)||!G.drive.has(k))continue;if(block&&block.has(k)&&!(n[0]===to[0]&&n[1]===to[1]))continue;prev.set(k,c);q.push(n);}}
  if(!prev.has(K(...to)))return null;const p=[];let c=to;while(c){p.unshift(c);c=prev.get(K(...c));}return p;}
function computeLane(){
  if(!G.win){LANE={ok:false,msg:'No window yet'};return;}
  const f=winFront();if(!G.drive.has(K(...f))){LANE={ok:false,msg:'Pave the tile outside the window'};return;}
  const curbs=[...G.drive].map(k=>k.split(',').map(Number)).filter(([x])=>x===SIDEWALK).filter(c=>bfs(f,c));
  if(!curbs.length){LANE={ok:false,msg:'Connect the driveway to the street'};return;}
  if(curbs.length<2){LANE={ok:false,msg:'Add a second exit to the street'};return;}
  curbs.sort((a,b)=>b[1]-a[1]);const entry=curbs[0];
  const inPath=bfs(entry,f);let best=null;
  for(const c of curbs.slice(1)){const p=bfs(f,c,new Set(inPath.slice(0,-1).map(t=>K(...t))))||bfs(f,c);if(p&&(!best||p.length<best.length))best=p;}
  LANE={ok:true,entry,exit:best[best.length-1],inPath,outPath:best,slots:inPath.length};
  /* lane arrows */ARROW=new Map();const all=[...inPath,...best.slice(1)];for(let i=0;i<all.length-1;i++)ARROW.set(K(...all[i]),[all[i+1][0]-all[i][0],all[i+1][1]-all[i][1]]);}
let ARROW=new Map();
computeLane();

/* ---------- XP, levels, achievements ---------- */
const lvOf=xp=>{let l=1;for(let i=0;i<LEVELS.length;i++)if(xp>=LEVELS[i].xp)l=i+1;return l;};
function addXP(n,why){if(n<=0)return;G.xp+=n;const l=lvOf(G.xp);if(l>G.level){G.level=l;G.st.level=l;toast('▲',`Level ${l}: ${LEVELS[l-1].t}`,`Unlocked: ${UNLOCK_TXT[l]}`);checkAch();}renderTop();}
function stat(k,v,max){if(max)G.st[k]=Math.max(G.st[k],v);else G.st[k]=v;checkAch();}
function bump(k,n=1){G.st[k]=(G.st[k]||0)+n;checkAch();}
function checkAch(){for(const a of ACH){if(G.ach.has(a.id))continue;if((G.st[a.stat]||0)>=a.goal){G.ach.add(a.id);toast('★',a.t,a.xp?`+${a.xp} XP`:'Badge earned');if(a.xp)addXP(a.xp);}}if(G.panelOpen)renderPanel();}

/* ---------- people & cars ---------- */
const WINSPOT=()=>[G.win.x-1+.5,G.win.y+.5];
const REG={stand:[7,10],clerk:[7,8]};/* customer stands at (7,10), clerk behind the counter at (7,8) */
function mkStaff(){for(const c of G.cars)c.claim=false;for(const p of G.peds)p.claim=false;G.staff=[];for(let i=0;i<G.clerks;i++)G.staff.push({x:REG.clerk[0]+.5+i,y:REG.clerk[1]+.5,task:null,t:0,role:i===1?'window':'any',col:i?'#2f7fd6':'#1d9e75'});}
mkStaff();
const pedQueue=()=>G.peds.filter(p=>p.st==='queue').sort((a,b)=>a.seq-b.seq);
let seq=0;
function spawnPed(){const y=Math.random()<.5?2+Math.floor(Math.random()*3):13+Math.floor(Math.random()*4);G.peds.push({x:SIDEWALK+.5,y:y+.5,path:[[SIDEWALK,G.door.y],[G.door.x+1,G.door.y],[G.door.x,G.door.y],[11,10]],st:'in',seq:seq++,wait:0,col:['#e07a5f','#8a6f9e','#3d85c6','#c98a12','#5b8c5a'][Math.floor(Math.random()*5)]});}
function spawnCar(){if(!LANE.ok)return;const e=LANE.entry;const first=LANE.inPath[0];
  if(G.cars.some(c=>c.ti===0&&c.on==='lane'&&!c.served))/* lane full at the curb: drives past */{bump('drovePast');G.st.streak=0;toast('·','A car drove past','The drive-thru line reached the street.',1);return;}
  G.cars.push({x:20.5,y:GD+1,on:'street',route:[[20,e[1]],[19,e[1]]],ti:-1,wait:0,col:['#c44536','#2d6a8f','#e9c46a','#6c757d','#2a9d8f','#f4f1de'][Math.floor(Math.random()*6)],served:false});}
function carTileOcc(t,self){return G.cars.some(c=>c!==self&&c.on==='lane'&&c.tile&&c.tile[0]===t[0]&&c.tile[1]===t[1]);}

function step(dt){
  G.t+=dt;
  /* spawns */
  G.nextPed-=dt;if(G.nextPed<=0){spawnPed();G.nextPed=2.6+Math.random()*2.4;}
  if(LANE.ok){G.nextCar-=dt;if(G.nextCar<=0){spawnCar();G.nextCar=2.8+Math.random()*2.6;}}
  /* pedestrians */
  for(const p of G.peds){
    if(p.st==='in'){const tgt=p.path[0];if(!tgt){p.st='queue';continue;}if(move(p,tgt[0]+.5,tgt[1]+.5,3.4*dt))p.path.shift();}
    else if(p.st==='queue'){const q=pedQueue();const i=q.indexOf(p);const spot=[REG.stand[0]+i,REG.stand[1]];move(p,spot[0]+.5,spot[1]+.5,3.4*dt);p.wait+=dt;if(p.wait>32&&i>1){p.st='out';p.mood='angry';p.path=[[G.door.x,G.door.y],[G.door.x+1,G.door.y],[SIDEWALK,G.door.y],[SIDEWALK,G.door.y+(Math.random()<.5?-6:5)]];bump('walkLost');}}
    else if(p.st==='out'){const tgt=p.path[0];if(!tgt){p.gone=true;continue;}if(move(p,tgt[0]+.5,tgt[1]+.5,3.4*dt))p.path.shift();}}
  G.peds=G.peds.filter(p=>!p.gone);
  /* cars */
  let inLine=0;
  for(const c of G.cars){
    if(c.on==='street'){const tgt=c.route[0];if(!tgt){c.on='lane';c.ti=0;c.tile=LANE.inPath[0];continue;}if(move(c,tgt[0]+.5,tgt[1]+.5,7*dt))c.route.shift();}
    else if(c.on==='lane'){if(!LANE.ok){c.on='exit';c.route=[[19,c.tile[1]],[19,-3]];continue;}
      const path=c.served?LANE.outPath:LANE.inPath;const cur=path[c.ti]||path[path.length-1];c.tile=cur;
      const arrived=move(c,cur[0]+.5,cur[1]+.5,3.4*dt);
      if(!c.served)inLine++;
      if(arrived){
        if(!c.served&&c.ti===path.length-1){c.st='window';c.wait+=dt;continue;}
        const nx=path[c.ti+1];if(!nx){c.on='exit';c.route=[[19,cur[1]],[19,-3]];c.tile=null;continue;}
        if(!carTileOcc(nx,c)){c.ti++;}else if(!c.served)c.wait+=dt;}}
    else if(c.on==='exit'){const tgt=c.route[0];if(!tgt){c.gone=true;continue;}if(move(c,tgt[0]+.5,tgt[1]+.5,7*dt))c.route.shift();}}
  G.cars=G.cars.filter(c=>!c.gone);
  if(inLine>(G.st.maxLine||0))stat('maxLine',inLine,true);
  /* clerks */
  for(const s of G.staff){
    if(s.task){const [tx,ty]=s.task.spot;if(move(s,tx,ty,3.4*dt)){s.t-=dt;if(s.t<=0)finish(s);}continue;}
    const carAt=G.cars.find(c=>c.st==='window'&&!c.served&&!c.claim);

function setTool(t){if(t&&UNLOCK[t==='erase'?'drive':t]>G.level){toast('🔒',`Reach level ${UNLOCK[t]} first`,UNLOCK_TXT[UNLOCK[t]]);return;}G.tool=G.tool===t?null:t;document.querySelectorAll('.tool').forEach(b=>b.classList.toggle('on',b.dataset.tool===G.tool));
  if((G.tool==='drive'||G.tool==='window')&&G.view!=='out')setView('out');
  hint(G.tool==='drive'?'Drag across your lot to pave. Cars need a way in from the street, past the window, and back out.':G.tool==='window'?'Tap the store\'s east wall to put the window there.':G.tool==='erase'?'Tap driveway or the window to remove it (half back).':G.tool==='land'?'Tap a lot with a FOR SALE sign.':G.view==='out'?'Outside view: the lot, the street and the land next door.':'Inside view: the clerk works the register and the drive-thru window.');}
document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));
function setView(v){G.view=v;document.getElementById('vIn').classList.toggle('on',v==='in');document.getElementById('vOut').classList.toggle('on',v==='out');cam.px=0;cam.py=0;cam.zk=1;fit();if(!G.tool)hint(v==='out'?'Outside view: the lot, the street and the land next door.':'Inside view: the clerk works the register and the drive-thru window.');}
document.getElementById('vIn').onclick=()=>setView('in');document.getElementById('vOut').onclick=()=>setView('out');
document.getElementById('zIn').onclick=()=>{cam.zk=Math.min(3,cam.zk*1.2);fit();};document.getElementById('zOut').onclick=()=>{cam.zk=Math.max(.6,cam.zk/1.2);fit();};
for(const [id,s] of [['sp0',0],['sp1',1],['sp3',3]])document.getElementById(id).onclick=()=>{G.speed=s;document.querySelectorAll('.sp button').forEach(b=>b.classList.toggle('on',b.id===id));};
document.getElementById('clerk2').onclick=()=>{if(G.clerks>=2){G.clerks=1;mkStaff();document.getElementById('clerk2').textContent='+ Window clerk';hint('Back to one clerk for the register and the window.');return;}G.clerks=2;mkStaff();document.getElementById('clerk2').textContent='− Window clerk';hint('A second clerk now works only the drive-thru window ($140 a day).');};
function hint(t,err){const h=document.getElementById('hint');h.textContent=t;h.classList.toggle('err',!!err);}

/* parcels */
function openParcel(k){const p=G.parcels[k];const sh=document.getElementById('sheet');const w=p.x1-p.x0+1,d=p.y1-p.y0+1;
  const lock=G.level<UNLOCK.land;const elock=G.level<UNLOCK.expand;const fl=floorTiles(p);
  sh.innerHTML=p.state==='sale'?`<h3><span>${p.name}</span><span class="num">${w}×${d}</span></h3><p>Next door to the store. Buy it to pave more driveway and parking, or later to expand the store onto it (+${fl} floor tiles).</p><p class="small">${lock?`Needs level ${UNLOCK.land} (${LEVELS[UNLOCK.land-1].t}).`:`Price $${p.price.toLocaleString()} · rent +$80 a week.`}</p><div class="acts"><button class="pri" id="buy" ${lock||G.cash<p.price?'disabled':''}>Buy for $${p.price.toLocaleString()}</button><button id="shx">Close</button></div>`
   :`<h3><span>${p.name} · yours</span><span class="num">${w}×${d}</span></h3><p>Pave it for parking and driveway, or expand the store onto the part next to the building (+${fl} floor tiles). The wall moves out and the new floor is empty, ready to build on.</p><p class="small">${elock?`Expanding needs level ${UNLOCK.expand} (${LEVELS[UNLOCK.expand-1].t}).`:`Build cost $${p.expand.toLocaleString()} · rent +$120 a week.`}</p><div class="acts"><button class="pri" id="exp" ${elock||G.cash<p.expand?'disabled':''}>Expand the store · $${p.expand.toLocaleString()}</button><button id="shx">Close</button></div>`;
  sh.hidden=false;document.getElementById('shx').onclick=()=>sh.hidden=true;
  const b=document.getElementById('buy');if(b)b.onclick=()=>{G.cash-=p.price;p.state='owned';bump('parcels');sh.hidden=true;hint(`${p.name} is yours. Pave it, or expand onto it at level ${UNLOCK.expand}.`);renderTop();};
  const e=document.getElementById('exp');if(e)e.onclick=()=>{expand(k);sh.hidden=true;};}
function floorTiles(p){const y0=p.y0<G.b.y0?p.y0:G.b.y1+1,y1=p.y0<G.b.y0?G.b.y0-1:Math.min(p.y1-1,G.b.y1+4);return (G.b.x1-G.b.x0+1)*(y1-y0+1);}
function expand(k){const p=G.parcels[k];const n=floorTiles(p);G.cash-=p.expand;
  for(const key of [...G.drive]){const [x,y]=key.split(',').map(Number);if(x<=G.b.x1&&parcelAt(x,y)===k)G.drive.delete(key);}
  if(p.y0<G.b.y0){p.fy1=G.b.y0-1;G.b.y0=p.y0;}else{G.b.y1=Math.min(p.y1-1,G.b.y1+4);p.fy1=G.b.y1;p.y0=p.y0;}
  p.state='floor';p.tiles=n;G.expanded=true;bump('expanded');computeLane();setView('in');hint(`The store grew by ${n} floor tiles. The wall moved out; the new space is empty.`);renderTop();}

/* ---------- UI ---------- */
function renderTop(){const l=G.level,cur=LEVELS[l-1].xp,nx=LEVELS[l]?LEVELS[l].xp:cur+1;document.getElementById('lvN').textContent=l;document.getElementById('lvT').textContent=LEVELS[l-1].t;document.getElementById('lvBar').style.width=Math.min(100,(G.xp-cur)/(nx-cur)*100)+'%';
  document.getElementById('cash').textContent='$'+Math.round(G.cash).toLocaleString();document.getElementById('served').textContent=(G.st.cars+G.st.walk);
  const ln=document.getElementById('lane');ln.classList.toggle('ok',LANE.ok);ln.classList.toggle('bad',!LANE.ok&&!!G.win);document.getElementById('laneT').textContent=LANE.ok?`Open · ${LANE.slots} in line max`:LANE.msg;
  document.querySelectorAll('.tool').forEach(b=>{const t=b.dataset.tool;const need=UNLOCK[t==='erase'?'drive':t];const lk=need>G.level;let s=b.querySelector('.lk');if(lk&&!s){s=document.createElement('span');s.className='lk';b.appendChild(s);}if(s)s.textContent=lk?`🔒 Lv ${need}`:'';if(!lk&&s)s.remove();});
  if(G.panelOpen)renderPanel();}
let tab='level';
function renderPanel(){const pb=document.getElementById('pbody');const l=G.level,cur=LEVELS[l-1].xp,nx=LEVELS[l]?LEVELS[l].xp:null;
  if(tab==='level')pb.innerHTML=`<div class="lvcard"><div class="t"><b>Level ${l}</b><span>${LEVELS[l-1].t}</span></div><span class="trk"><i style="width:${nx?Math.min(100,(G.xp-cur)/(nx-cur)*100):100}%"></i></span><span class="small num">${G.xp} XP${nx?` · ${nx-G.xp} to level ${l+1}`:' · max level'}</span>${nx?`<span class="small">Next: ${UNLOCK_TXT[l+1]}</span>`:''}</div>
    <div class="small">XP comes from running the store: +6 per drive-thru car, +4 per walk-in, and a bonus for each achievement.</div>
    ${LEVELS.map((L,i)=>{const n=i+1;const cls=n<l?'done':n===l?'now':'';return `<div class="row ${cls}"><span class="ic">${n<=l?n:'🔒'}</span><span><b>${L.t}</b><small>${UNLOCK_TXT[n]}</small></span><span class="r">${L.xp} XP</span></div>`;}).join('')}`;
  else if(tab==='ach')pb.innerHTML=`<div class="small">${G.ach.size} of ${ACH.length} earned</div>`+ACH.map(a=>{const v=Math.min(a.goal,G.st[a.stat]||0);const d=G.ach.has(a.id);return `<div class="row ${d?'done':''}"><span class="ic">${d?'★':'☆'}</span><span><b>${a.t}</b><small>${a.d}</small>${d?'':`<span class="trk"><i style="width:${v/a.goal*100}%"></i></span>`}</span><span class="r">${d?'done':`${v}/${a.goal}`}<br>${a.xp?`+${a.xp} XP`:'badge'}</span></div>`;}).join('');
  else pb.innerHTML=`<div class="plan">
    <h3>Outside view</h3><p>The store sits on a lot with the street on the east side. The outside view shows the roof, the lot, the street and the land next door. The inside view is today's game.</p>
    <h3>Drive-thru</h3><ul><li>A window in an outside wall, worked by a clerk from inside.</li><li>Needs a paved lane: in from the street, past the window, and back out. The tile outside the window turns red until it connects.</li><li>Cars wait in the lane. When the line reaches the street, new cars drive past.</li><li>One clerk splits time between the register and the window. A second clerk can stay on the window.</li></ul>
    <h3>More land</h3><ul><li>Lots next door are for sale from level ${UNLOCK.land}.</li><li>Pave them for a longer lane, or from level ${UNLOCK.expand} expand the store onto them. The wall moves out and the new floor starts empty.</li><li>Rent goes up with the space.</li></ul>
    <h3>Levels and achievements</h3><ul><li>XP comes from running the store, plus a bonus for each achievement.</li><li>Levels unlock the drive-thru, land and expansion in order, so each week has a next goal.</li><li>In the full game, the level carries over to your next store.</li></ul>
    <h3>Prototype limits</h3><p>Money, demand and service times here are simplified. In the game they use the real numbers for waits, patience, trust and insurers.</p></div>`;}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));renderPanel();});
const openPanel=o=>{G.panelOpen=o;document.getElementById('panel').classList.toggle('open',o);if(o)renderPanel();};
document.getElementById('career').onclick=()=>openPanel(!G.panelOpen);document.getElementById('lvlChip').onclick=()=>openPanel(!G.panelOpen);document.getElementById('lvlChip').onkeydown=e=>{if(e.key==='Enter')openPanel(!G.panelOpen);};document.getElementById('pClose').onclick=()=>openPanel(false);
let lastToast=0;function toast(icon,t,s,quiet){const now=performance.now();if(quiet&&now-lastToast<4000)return;lastToast=now;const el=document.createElement('div');el.className='toast';el.innerHTML=`<i>${icon}</i><span>${t}${s?`<small>${s}</small>`:''}</span>`;const box=document.getElementById('toasts');box.appendChild(el);while(box.children.length>3)box.firstChild.remove();setTimeout(()=>el.remove(),3200);}

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(G.speed>0){const n=G.speed;for(let i=0;i<n;i++)step(dt);}for(const f of FX)f.t+=dt;FX=FX.filter(f=>f.t<1.2);draw();requestAnimationFrame(frame);}
window.addEventListener('resize',resize);new ResizeObserver(resize).observe(cv);
/* open on a working moment: two cars already in the lane, two customers inside */
{const L=LANE;const cols=['#c44536','#2d6a8f'];[L.inPath.length-1,L.inPath.length-3].forEach((ti,i)=>{const t=L.inPath[ti];G.cars.push({x:t[0]+.5,y:t[1]+.5,on:'lane',ti,tile:t,route:[],wait:0,col:cols[i],served:false,dir:'y'});});
 for(let i=0;i<2;i++){G.peds.push({x:REG.stand[0]+i+.5,y:REG.stand[1]+.5,path:[],st:'queue',seq:seq++,wait:0,col:i?'#8a6f9e':'#e07a5f'});}}
resize();renderTop();requestAnimationFrame(frame);
window.__lot={G,computeLane,step,setView,setTool,expand,openParcel,LANE:()=>LANE};
})();
</script>
